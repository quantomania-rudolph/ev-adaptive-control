name: CI

# WHEN this runs:
#   - on every push to any branch
#   - on every pull request into main
# This is the "continuous integration" gate: nothing merges into main unless this is green.
on:
  push:
  pull_request:
    branches: [main]

# If you push twice quickly, cancel the older run instead of wasting minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  # Each segment gets its OWN job. If only "actuator" is red in the GitHub UI,
  # the actuator owner knows it's theirs, and everyone else can keep working.
  unit-tests:
    name: Unit tests (${{ matrix.segment }}, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        segment: [datagen, actuator, evaluation]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/${{ matrix.segment }} --cov=evcontrol.${{ matrix.segment }} --cov-report=term-missing

  # Integration only runs if every unit test job passed (`needs`).
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -m integration

  # Proves the package builds into an installable wheel (catches packaging mistakes early).
  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
