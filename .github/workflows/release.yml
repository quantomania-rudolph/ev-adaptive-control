name: Release

# The "CD" (deployment) half. It runs only when someone pushes a version tag like v0.2.0.
# Result: a GitHub Release page with the built package attached, so everyone can
# `pip install` a known-good, frozen version (handy for reproducing paper results).
#
# To cut a release (after main is green):
#   git tag v0.2.0
#   git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build ".[dev]"
      # Never publish something that doesn't pass its own tests.
      - run: pytest
      - run: python -m build
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
